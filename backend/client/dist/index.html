    <!-- Your custom JavaScript to handle nested dropdowns -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Select all dropdown-submenu elements
        const submenus = document.querySelectorAll('.dropdown-submenu');
        
        // Add event listener to each submenu
        submenus.forEach(function (submenu) {
          const submenuLink = submenu.querySelector('.dropdown-item');
          
          submenuLink.addEventListener('click', function (event) {
            event.stopPropagation(); // Prevent closing of the main dropdown
            submenu.classList.toggle('show'); // Toggle the submenu visibility
          });
          
          // Close the submenu when clicking outside
          document.addEventListener('click', function () {
            submenu.classList.remove('show');
          });
        });
      });
    </script>

  </body>
